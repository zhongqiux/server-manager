name: Build desktop release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            asset: ServerManager-windows-x64.exe
          - os: macos-15
            target: macos-arm64
            asset: ServerManager-macos-arm64.tar.gz
          - os: macos-15-intel
            target: macos-x64
            asset: ServerManager-macos-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build single-file binary
        run: npm run dist

      - name: Smoke test
        run: node scripts/smoke-sea.mjs

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp release/ServerManager.exe "package/${{ matrix.asset }}"
          else
            mkdir -p package/stage
            cp release/ServerManager package/stage/
            cp .github/release-macos.txt package/stage/README.txt
            tar -czf "package/${{ matrix.asset }}" -C package/stage .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: package/${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-dryrun')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Write checksums
        run: cd assets && sha256sum * > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes=$(cat <<'EOF'
          ## 下载

          | 平台 | 文件 |
          |---|---|
          | Windows 10 / 11 x64 | `ServerManager-windows-x64.exe` |
          | macOS Apple Silicon | `ServerManager-macos-arm64.tar.gz` |
          | macOS Intel | `ServerManager-macos-x64.tar.gz` |

          ## 首次运行

          - Windows：exe 未签名，SmartScreen 提示时选择“更多信息 → 仍要运行”。
          - macOS：解压后执行 `chmod +x ServerManager && ./ServerManager`；若提示“无法验证开发者”，在“系统设置 → 隐私与安全性”点击“仍要打开”，或执行 `xattr -dr com.apple.quarantine ServerManager`。

          校验文件见 `SHA256SUMS.txt`。

          - 使用说明：${{ github.server_url }}/${{ github.repository }}#快速开始
          - 宣传页：https://zhongqiux.github.io/server-manager/
          EOF
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" assets/* --clobber
          else
            gh release create "$tag" assets/* --verify-tag --title "$tag" --notes "$notes"
          fi